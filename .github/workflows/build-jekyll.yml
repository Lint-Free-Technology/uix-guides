name: Build UIX Guides

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push to gh-pages branch
    steps:
      - uses: actions/checkout@v4

      # Build with the project's own Gemfile rather than GitHub Pages' bundled
      # Jekyll. setup-ruby stores vendor/bundle in the GitHub Actions cache and
      # invalidates it automatically when Gemfile.lock changes.
      - name: Set up Ruby and restore the bundle cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ./_site

      # Keep the existing GitHub Pages publishing source (the gh-pages branch).
      # This deploys the already-built static files; it does not run Jekyll again.
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          cname: uix-guides.lf.technology
